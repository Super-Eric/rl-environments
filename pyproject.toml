[project]
name = "rl-environments"
version = "0.1.0"
description = "Verifiers v1 RL environments and evals for LLM post-training."
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = []

[dependency-groups]
dev = [
    "verifiers>=0.3.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.0",
    # every environment package, installed editable from the workspace so that
    # `uv sync` alone makes the whole catalog importable by `eval` / `validate`.
    "geo-reprojection-v1",
    "au-bas-reconciliation-v1",
    "sci-pipeline-v1",
    "terminal-agentic-v1",
    "pandas-agentic-v1",
    "two-hop-latent-v1",
]

[tool.uv.sources]
geo-reprojection-v1 = { workspace = true }
au-bas-reconciliation-v1 = { workspace = true }
sci-pipeline-v1 = { workspace = true }
terminal-agentic-v1 = { workspace = true }
pandas-agentic-v1 = { workspace = true }
two-hop-latent-v1 = { workspace = true }

[tool.uv.workspace]
members = ["environments/*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I"]
