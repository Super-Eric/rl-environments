[project]
name = "sci-pipeline-v1"
version = "0.1.1"
description = "Clean and aggregate a messy hourly sensor CSV inside a sandbox; graded only on the result.json the agent writes."
license = "MIT"
requires-python = ">=3.11"
dependencies = ["verifiers>=0.3.1"]
tags = ["v1", "multi-turn", "agentic", "sandbox", "tool-use", "data-engineering", "science", "deterministic-reward", "eval", "train"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sci_pipeline_v1"]
