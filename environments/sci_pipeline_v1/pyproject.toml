[project]
name = "sci-pipeline-v1"
version = "0.1.0"
description = "sci-pipeline-v1 — clean and aggregate a messy sensor time series in a sandbox; graded on the artifact the agent writes, not on what it says."
requires-python = ">=3.11"
dependencies = ["verifiers>=0.3.1"]
tags = ["v1", "multi-turn", "agentic", "sandbox", "tool-use", "data-engineering", "science", "deterministic-reward"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sci_pipeline_v1"]
