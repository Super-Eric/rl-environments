[project]
name = "geo-reprojection-v1"
version = "0.1.0"
description = "geo-reprojection-v1 — procedurally generated coordinate reprojection and geodesy on the WGS84/GDA2020 ellipsoid, verified against PROJ."
requires-python = ">=3.11"
dependencies = ["verifiers>=0.3.1", "pyproj>=3.6"]
tags = ["v1", "single-turn", "geospatial", "procedural", "deterministic-reward", "reasoning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geo_reprojection_v1"]
