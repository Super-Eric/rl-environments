[project]
name = "au-bas-reconciliation-v1"
version = "0.1.0"
description = "Reconcile a synthetic Australian GST ledger to a corrected BAS, finding its bookkeeping faults along the way."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["verifiers>=0.3.1"]
tags = ["v1", "train", "eval", "single-turn", "finance", "accounting", "compliance", "procedural", "deterministic-reward"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["au_bas_reconciliation_v1"]
