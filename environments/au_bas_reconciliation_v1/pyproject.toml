[project]
name = "au-bas-reconciliation-v1"
version = "0.1.0"
description = "au-bas-reconciliation-v1 — reconcile a synthetic Australian GST ledger to a corrected BAS, finding injected compliance faults."
requires-python = ">=3.11"
dependencies = ["verifiers>=0.3.1"]
tags = ["v1", "single-turn", "finance", "accounting", "compliance", "procedural", "deterministic-reward", "long-context"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["au_bas_reconciliation_v1"]
