[project]
name = "two-hop-latent-v1"
version = "0.1.0"
description = "two-hop-latent-v1 — faithful port of the 'Lessons from Studying Two-Hop Latent Reasoning' (arXiv:2411.16353) semi-synthetic evaluation: single-turn two-hop QA with the paper's own substring grading, first-hop and CoT-order signals."
requires-python = ">=3.11"
dependencies = ["verifiers>=0.3.1", "requests"]
tags = ["v1", "single-turn", "reasoning", "paper-reimplementation", "deterministic-reward", "eval", "train"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["two_hop_latent_v1"]
