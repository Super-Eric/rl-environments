[project]
name = "two-hop-latent-v1"
version = "0.1.0"
description = "Single-turn two-hop QA port of the semi-synthetic evaluation from 'Lessons from Studying Two-Hop Latent Reasoning' (arXiv:2411.16353), graded with the paper's substring rule."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["verifiers>=0.3.1", "requests"]
tags = ["v1", "single-turn", "reasoning", "paper-reimplementation", "deterministic-reward", "eval"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["two_hop_latent_v1"]
