[project]
name = "pandas-agentic-v1"
version = "0.1.0"
description = "pandas-agentic-v1 — sandboxed agentic pandas tasks (repair, reconcile, reshape) graded on the artifact the agent writes, verified by a pandas-free reference."
requires-python = ">=3.11"
dependencies = ["verifiers>=0.3.1"]
tags = ["v1", "multi-turn", "agentic", "sandbox", "tool-use", "data-engineering", "pandas", "deterministic-reward"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pandas_agentic_v1"]
