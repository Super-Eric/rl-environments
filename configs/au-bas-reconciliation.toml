# A long, dense ledger: 60 rows at a 35% fault rate is a genuinely hard audit.
model = "openai/gpt-5-mini"
num_tasks = 30

[sampling]
temperature = 0.0

[env.taskset]
id = "au-bas-reconciliation-v1"
num_transactions = 60
fault_rate = 0.35

[env.agent.harness]
id = "null"

# Tool-less taskset: the harness program runs on the host, so no sandbox is provisioned
# (the framework default `prime` runtime would start one VM per rollout).
[env.agent.runtime]
type = "subprocess"

# Bound each rollout so a provider retry loop cannot hang the run.
[env.timeout]
episode = 480
