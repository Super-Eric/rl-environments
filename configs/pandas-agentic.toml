# Agentic: the model needs a shell and a pandas-capable sandbox to repair, reconcile or
# reshape the CSV and write the graded artifact.
model = "openai/gpt-5-mini"
num_tasks = 10

[sampling]
temperature = 0.0

[env.taskset]
id = "pandas-agentic-v1"

[env.agent.harness]
id = "bash"

[env.agent.runtime]
type = "docker"

# Bound each rollout so a provider retry loop cannot hang the run.
[env.timeout]
episode = 900
